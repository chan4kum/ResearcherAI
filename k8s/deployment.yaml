apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-api-deployment
  namespace: agentic-platform
  labels:
    app: agentic-api
    app.kubernetes.io/name: agentic-api
    app.kubernetes.io/component: backend-api
spec:
  replicas: 5
  selector:
    matchLabels:
      app: agentic-api
  template:
    metadata:
      labels:
        app: agentic-api
        app.kubernetes.io/name: agentic-api
        app.kubernetes.io/component: backend-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: agentic-api
          image: enterprise-agentic-platform:v3


          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: agentic-api-config
            - secretRef:
                name: agentic-api-secrets

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 4
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

