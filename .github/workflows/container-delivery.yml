name: Container Delivery

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ecr_registry:
        description: "Amazon ECR Registry URL (e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com)"
        required: false
        default: ""
      ecr_repository:
        description: "Amazon ECR Repository Name"
        required: false
        default: "enterprise-agentic-platform"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'enterprise-agentic-platform' }}

jobs:
  # ============================================================================
  # Stage 1: Quality, Static Analysis, and Tests
  # ============================================================================
  test-and-lint:
    name: Lint, Test & SAST Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install .[dev]

      - name: Lint with Ruff
        run: |
          echo "::group::Ruff Linting"
          ruff check .
          echo "::endgroup::"

      - name: Static Type Checking with Mypy
        run: |
          echo "::group::Mypy Static Typing"
          mypy app
          echo "::endgroup::"

      - name: Run Test Suite
        env:
          APP_ENV: testing
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: mock
          SECURITY_ENABLED: "false"
          RATE_LIMIT_ENABLED: "false"
        run: |
          echo "::group::Pytest Test Execution"
          pytest -v --junitxml=junit/test-results.xml
          echo "::endgroup::"

      - name: Bandit SAST Scan
        run: |
          echo "::group::Bandit AST Scan"
          bandit -r app/ -ll
          echo "::endgroup::"

  # ============================================================================
  # Stage 2: Container Security Scan
  # ============================================================================
  container-security-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [test-and-lint]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: enterprise-agentic-platform:scan-target
          load: true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "enterprise-agentic-platform:scan-target"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  # ============================================================================
  # Stage 3: Amazon ECR Delivery with Immutable Tagging
  # ============================================================================
  deliver-to-ecr:
    name: Build & Push to Amazon ECR
    runs-on: ubuntu-latest
    needs: [test-and-lint, container-security-scan]
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials (OIDC or Secret Keys)
        uses: aws-actions/configure-aws-credentials@v4
        if: env.AWS_ACCESS_KEY_ID != '' || vars.AWS_ROLE_ARN != ''
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        if: env.AWS_ACCESS_KEY_ID != '' || vars.AWS_ROLE_ARN != ''

      - name: Determine Registry Host
        id: registry-info
        run: |
          if [ -n "${{ steps.login-ecr.outputs.registry }}" ]; then
            echo "registry=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.ecr_registry }}" ]; then
            echo "registry=${{ inputs.ecr_registry }}" >> "$GITHUB_OUTPUT"
          else
            echo "registry=local-ecr-mirror.amazonaws.com" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Immutable Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registry-info.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            # 1. Short Git Commit SHA (Immutable)
            type=sha,format=short,prefix=sha-
            # 2. Full Git Commit SHA (Immutable)
            type=sha,format=long,prefix=sha-
            # 3. GitHub Actions Run Number (Immutable)
            type=raw,value=build-${{ github.run_number }}
            # 4. Semantic Versioning Tag (Immutable for releases)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # 5. Branch Name (Mutable alias)
            type=ref,event=branch

      - name: Build & Push Image to Amazon ECR
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.AWS_ACCESS_KEY_ID != '' || vars.AWS_ROLE_ARN != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output Immutable Deployment Digest
        run: |
          echo "============================================================"
          echo " Container Delivery to Amazon ECR Complete"
          echo "============================================================"
          echo "Target Registry: ${{ steps.registry-info.outputs.registry }}"
          echo "Repository:      ${{ env.ECR_REPOSITORY }}"
          echo "Image Digest:    ${{ steps.build-and-push.outputs.digest }}"
          echo "Generated Tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "============================================================"
