name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
      - dev
      - staging
  pull_request:
    branches:
      - main
      - master
      - dev
      - staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Stage 1 & 2: Lint, Type Check, and Test
  # ============================================================================
  test-and-lint:
    name: Lint, Test & Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install .[dev]

      - name: Lint with Ruff
        run: |
          echo "::group::Ruff Linting"
          ruff check .
          echo "::endgroup::"

      - name: Type Check with Mypy
        run: |
          echo "::group::Mypy Type Checking"
          mypy app
          echo "::endgroup::"

      - name: Run Unit & Integration Tests
        env:
          APP_ENV: testing
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: mock
          SECURITY_ENABLED: "false"
          RATE_LIMIT_ENABLED: "false"
        run: |
          echo "::group::Pytest Test Suite"
          pytest -v --junitxml=junit/test-results.xml
          echo "::endgroup::"

      - name: SAST Security Scan with Bandit
        run: |
          echo "::group::Bandit Security Scan"
          bandit -r app/ -ll
          echo "::endgroup::"

      - name: Verify No Sensitive Secrets in Working Tree
        run: |
          echo "::group::Secret Leak Prevention"
          # Ensure .env is never tracked or logged
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "ERROR: .env file is tracked in git! Please remove it immediately."
            exit 1
          else
            echo "Verified: .env is properly gitignored."
          fi
          echo "::endgroup::"

  # ============================================================================
  # Stage 2: LLM Quality & Regression Testing (Milestone 49)
  # ============================================================================
  llm-regression-testing:
    name: LLM Quality & Regression Gate
    runs-on: ubuntu-latest
    needs: [test-and-lint]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install .[dev]

      - name: Run LLM Regression Quality Gate
        env:
          APP_ENV: testing
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: mock
        run: |
          echo "::group::LLM Regression Evaluation"
          python -m evals.regression --output-markdown $GITHUB_STEP_SUMMARY --fail-on-regression
          echo "::endgroup::"

      - name: Upload Evaluation Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-evaluation-reports
          path: evals/reports/
          retention-days: 14

  # ============================================================================
  # Stage 3: Build Verification
  # ============================================================================
  build-verification:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [test-and-lint, llm-regression-testing]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: enterprise-agentic-platform:ci-test
          load: true

      - name: Smoke Test Container Runtime
        run: |
          echo "::group::Container Smoke Test"
          docker run --rm enterprise-agentic-platform:ci-test python -c "
          import app.main
          print('Successfully imported app.main in production container image')
          "
          echo "::endgroup::"
