apiVersion: v1
kind: Secret
metadata:
  name: {{ include "enterprise-agentic-platform.fullname" . }}-secrets
  labels:
    {{- include "enterprise-agentic-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  API_SECRET_KEY: {{ .Values.secrets.apiSecretKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
