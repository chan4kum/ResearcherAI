# Production values for AWS EKS deployment of enterprise-agentic-platform.

replicaCount: 3

image:
  repository: enterprise-agentic-platform
  pullPolicy: IfNotPresent
  tag: "v3"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/health"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

config:
  appEnv: "production"
  host: "0.0.0.0"
  port: 8000
  logLevel: "INFO"
  llmProvider: "mock"
  llmModel: "gpt-4o-mini"
  embeddingProvider: "mock"
  embeddingModel: "text-embedding-3-small"
  vectorRepositoryType: "auto"
  defaultRetrievalMode: "hybrid"
  rateLimitEnabled: "true"
  rateLimitPerMinute: "120"
  securityEnabled: "true"

secrets:
  apiSecretKey: "agentic-ai-platform-super-secret-key-2026"
  openaiApiKey: "mock-openai-production-key-encrypted"
  databaseUrl: "postgresql+asyncpg://postgres:postgres_password@agentic-postgres:5432/agentic_db"

service:
  type: LoadBalancer
  port: 8000
  targetPort: 8000

ingress:
  enabled: false

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

probes:
  startup:
    enabled: true
    path: /live
    initialDelaySeconds: 2
    periodSeconds: 3
    timeoutSeconds: 2
    failureThreshold: 10
  readiness:
    enabled: true
    path: /ready
    initialDelaySeconds: 4
    periodSeconds: 3
    timeoutSeconds: 2
    failureThreshold: 2
    successThreshold: 1
  liveness:
    enabled: true
    path: /live
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
